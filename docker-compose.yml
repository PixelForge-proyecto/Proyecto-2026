# Translogística / laboratorio VMware — MySQL 8.4 todavía es temporal.
# La base de datos definitiva, su replicación y ProxySQL están pendientes.
name: pixelforge

services:
  web:
    build:
      context: ./2° Entrega/Programación/Despliegue-Laravel-Docker/apache
    container_name: pixelforge-web
    ports:
      - "80:80"
    volumes:
      - "./2° Entrega/Programación/Despliegue-Laravel-Docker/app-nueva:/var/www/html:Z"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    # Servicio EXISTENTE del laboratorio, NO la base de datos final.
    image: mysql:8.4
    container_name: pixelforge-db
    env_file:
      - .env.docker
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
