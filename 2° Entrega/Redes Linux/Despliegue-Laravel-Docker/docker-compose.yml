name: pixelforge

services:
  web:
    build:
      context: ./apache
    container_name: pixelforge-web
    ports:
      - "80:80"
    volumes:
      - ./app-nueva:/var/www/html:Z
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    container_name: pixelforge-db
    env_file:
      - .env.docker
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent -h 127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
